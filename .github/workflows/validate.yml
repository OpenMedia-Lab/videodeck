name: Validate
on:
  push:
  pull_request:
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test timeline and package
        run: python3 -m unittest discover -s tests -v
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: videodeck/assets/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: videodeck/assets/example/package-lock.json
      - run: npm ci
      - run: npm run lint
